name: Build ARM64 image (native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # manual trigger

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native ARM64 runner (no QEMU)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64   # only ARM64, native speed
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/straps:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/straps:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max